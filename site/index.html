<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margazhi Song Lists 2026 · Chennai December Season</title>
<meta name="description" content="Rasikas share the song lists of Chennai December Season concerts. Season-wide view of ragas, krithis and rare pieces. Open data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%237a1f2b'/><circle cx='32' cy='32' r='6' fill='%23e8b04a'/><g fill='%23e8b04a'><circle cx='32' cy='12' r='3'/><circle cx='32' cy='52' r='3'/><circle cx='12' cy='32' r='3'/><circle cx='52' cy='32' r='3'/></g></svg>">
<script src="config.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <svg class="kolam" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 3c6 6 6 11 0 17-6-6-6-11 0-17zM20 37c-6-6-6-11 0-17 6 6 6 11 0 17zM3 20c6-6 11-6 17 0-6 6-11 6-17 0zM37 20c-6 6-11 6-17 0 6-6 11-6 17 0z"/></g><g fill="currentColor"><circle cx="20" cy="20" r="1.8"/><circle cx="9" cy="9" r="1.3"/><circle cx="31" cy="9" r="1.3"/><circle cx="9" cy="31" r="1.3"/><circle cx="31" cy="31" r="1.3"/></g></svg>
    <span><b>Margazhi Song Lists</b><small>Chennai December Season 2026</small></span>
  </a>
  <nav>
    <a href="#/" data-nav="season">Season</a>
    <a href="#/concerts" data-nav="concerts">Concerts</a>
    <a href="#/daily" data-nav="daily">Daily</a>
    <a href="#/submit" data-nav="submit" class="cta">Share a list</a>
  </nav>
</header>
<main id="app" aria-live="polite"><p class="loading">Loading…</p></main>
<footer>
  <p>Built by rasikas, for rasikas. Song catalogue from <a href="https://www.karnatik.com/lyrics.shtml" rel="noopener">karnatik.com</a>. All confirmed lists will be released as open data after the season.
  <a href="#/about">How it works</a> · <a href="https://github.com/mahesh-iitm/chennai-music-season-2026" rel="noopener">Source &amp; data</a></p>
</footer>
<template id="tpl-row">
  <li class="row">
    <div class="row-num"></div>
    <div class="row-body">
      <div class="written"></div>
      <div class="pick">
        <input class="q" type="text" placeholder="Search song title" autocomplete="off" aria-label="Song">
        <div class="suggest" role="listbox"></div>
      </div>
      <div class="meta">
        <label>Raga <input class="raga" type="text" list="raga-list"></label>
        <label>Tala <input class="tala" type="text" list="tala-list"></label>
        <label>Type <select class="type">
          <option value="kriti">Kriti</option><option value="varnam">Varnam</option><option value="rtp">RTP</option>
          <option value="viruttam">Viruttam / Slokam</option><option value="tani">Tani Avartanam</option><option value="thillana">Thillana</option>
          <option value="javali">Javali</option><option value="padam">Padam</option><option value="bhajan">Bhajan / Abhang</option>
          <option value="tukkada">Tukkada</option><option value="mangalam">Mangalam</option><option value="other">Other</option>
        </select></label>
        <label class="wide">Notes <input class="notes" type="text" placeholder="main, alapana, niraval, swaram…"></label>
      </div>
      <div class="status"></div>
    </div>
    <div class="row-tools">
      <button class="up" title="Move up" aria-label="Move up">↑</button>
      <button class="down" title="Move down" aria-label="Move down">↓</button>
      <button class="del" title="Remove" aria-label="Remove">✕</button>
    </div>
  </li>
</template>
<datalist id="raga-list"></datalist>
<datalist id="tala-list"></datalist>
<script src="app.js"></script>
</body>
</html>
