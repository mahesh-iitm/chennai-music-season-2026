name = "chennai-music-season-2026"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Comma-separated origins allowed to call the API (your GitHub Pages URL).
ALLOWED_ORIGINS = "https://mahesh-iitm.github.io"
MODEL = "claude-sonnet-5-5"
OCR_DAILY_LIMIT = "400"      # photos read per day across all rasikas (cost cap)
OCR_PER_IP_LIMIT = "15"      # photos read per day per connection
SUBMIT_PER_IP_LIMIT = "30"

[[d1_databases]]
binding = "DB"
database_name = "cms2026"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   ANTHROPIC_API_KEY   - your Anthropic API key
#   EXPORT_TOKEN        - long random string; same value goes in the GitHub repo secret
#   IP_SALT             - long random string
#   TURNSTILE_SECRET    - optional, Cloudflare Turnstile bot check
